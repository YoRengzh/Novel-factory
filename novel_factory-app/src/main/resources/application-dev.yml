server:
  port: 8080
  # 只监听回环地址：本项目无鉴权（localhost 个人使用），绑定 0.0.0.0 会让同网段
  # 任何机器都能读写稿件、改 LLM 地址（把 Key 送到外部）。桌面壳与浏览器访问都不受影响
  address: 127.0.0.1

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 配置来源；application-local.yml 为开发者本地覆盖（已被 .gitignore 排除，可放密钥），
# 缺失时 optional 前缀保证不报错。它排在默认值之后，因此能覆盖 novel-generation.yml。
spring:
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  config:
    import:
      - classpath:novel-generation.yml
      - optional:classpath:application-local.yml
      - optional:file:./config/application-local.yml

      # 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml