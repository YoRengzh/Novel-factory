story:
  defaults:
    language: "中文"
    totalCount: 2000

  module:
    ai-api:
      base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${LLM_API_KEY:}
      # 接口协议：openai（默认，Chat Completions）/ anthropic（Claude Messages）/ responses（OpenAI Responses）。
      # 设置页选中中转站时按该站协议走；留空 = openai（升级前行为）
      # protocol: openai
    chat-model:
      model: qwen3.8-flash
      max-tokens: 16384
      temperature: 0.7
      enable-thinking: false
    # 总开关：true=所有场景统一用 chat-model；false=按 scene-models 分场景路由
    unified-model-enabled: false

    # 说明：场景模型可使用与全局 ai-api 不同的 base-url / api-key / completions-path——
    # 在单个场景条目下加这三个字段即可（未配的字段逐项回落全局）。适用场景：让某几个场景
    # 走不同供应商（第二模型族，典型如评审场景指向异族模型以保证盲评中立）。
    # 也可在设置页按场景运行时覆盖（优先级：设置页覆盖 > 场景 yml > 全局），并受设置页
    #「启用场景级 API」总开关管：关闭时所有场景强制走全局地址密钥，场景自带一律不生效。
    scene-models:
      stage-blueprint:
        model: deepseek-v4-pro
        # 全局模型覆盖可能启用思考型模型，输出上限需给思考和结构化蓝图共同留出空间。
        # 上限只是天花板，不改变实际输出量。
        max-tokens: 65536
        temperature: 0.7 # 非推理模型，沿用常规采样温度（>0 保证方向分支有差异）；kimi-k3 才是必须 1.0
        enable-thinking: false
      chapter-plan:
        # 必调且对延迟敏感的规划场景应避免无法控制思考预算的模型。
        # 思考占满输出预算时无法产出计划；应急处置见 novel.llm.on-budget-burn。
        model: qwen3.8-max
        # 输出上限需同时覆盖思考和计划；过小会让思考占满预算而产生空正文。
        # 供应商也可能按模型能力限制输出，应结合模型配置核对有效上限。
        max-tokens: 100000
        temperature: 1.0 # 必须 1.0，理由见上方说明
        enable-thinking: true
      chapter-beats:
        model: deepseek-v4.1-flash
        # 节拍输出上限需覆盖结构化正文与可能的思考开销，避免空输出触发额外降级调用。
        # 上限只是天花板，不改变实际输出量。
        max-tokens: 16384
        temperature: 0.3
        enable-thinking: false
      chapter-content:
        model: glm-5.2
        # 正文是核心交付物，输出预算需覆盖正文与可能的思考开销。
        # 完整计划和写作约束会扩大输入前缀，不能仅按最终正文字数估算预算。
        max-tokens: 100000
        temperature: 0.8 # 轻装写作模式搭配较高温度，释放情绪张力与自然口语
        enable-thinking: false
      chapter-rewrite:
        model: qwen3.8-max
        max-tokens: 16384
        temperature: 0.7
        enable-thinking: false
      chapter-judge:
        model: deepseek-v4.1-flash
        max-tokens: 1024
        temperature: 0.2
        enable-thinking: false
      audit:
        model: qwen3.7-plus
        max-tokens: 33768
        temperature: 0.1
        enable-thinking: false
      paragraph-audit:
        model: deepseek-v4-flash
        max-tokens: 16384
        temperature: 0.1
        enable-thinking: false
      revise:
        model: qwen3.7-plus
        max-tokens: 16384
        temperature: 0.4
        enable-thinking: false
      summary:
        model: deepseek-v4-flash
        max-tokens: 33768
        temperature: 0.2
        enable-thinking: false
      ledger-adjudicate:
        model: deepseek-v4-flash
        max-tokens: 4096
        temperature: 0.1
        enable-thinking: false
      foreshadow-settlement:
        model: deepseek-v4.1-flash
        max-tokens: 16384
        temperature: 0.1
        enable-thinking: false
      exit-review:
        model: deepseek-v4-pro
        max-tokens: 16384
        temperature: 0.1
        enable-thinking: false
      finale-review:
        model: deepseek-v4-pro
        max-tokens: 16384
        temperature: 0.1
        enable-thinking: false
      ref-select:
        model: deepseek-v4-flash
        max-tokens: 2048
        temperature: 0.1
        enable-thinking: false
      quality-review:  # 全书质量评分（每 N 章一次，抽样打分）：低频高价值判定，给 pro 档；
                       # 输出是若干条维度评分的小 JSON，max-tokens 无需大。cost 与效果单独核算——
                       # 这是"改了 prompt 之后质量是变好还是变差"的唯一对照基线
        model: deepseek-v4-pro
        max-tokens: 4096
        temperature: 0.1
        enable-thinking: false
      chapter-rebase:  # 观察式 Rebase 候选：读真实人物状态提计划差异，不直接写正文。
                       # 规划类任务，可与正文模型分族；默认 story.rebase.mode=OFF 时不调用。
        model: kimi-k3
        max-tokens: 24000
        temperature: 1.0
        enable-thinking: true
    # 全局兜底模型：所有场景共用这一个，主模型与场景配置都不可用时才启用。
    # 为什么只留一个：兜底的前提是"原路走不通"——额度耗尽/模型下线常按供应商计量，
    # 同供应商的另一个模型往往一起挂，所以兜底的价值全在换供应商。此前 17 个场景各配一条链，
    # 实际填的几乎都是同样的值，维护成本远高于收益。
    # 自带 base-url / api-key / max-tokens：换供应商时地址密钥与输出上限都必须能跟着变
    # （异族模型的上限与主模型常不同，沿用会直接 400）。留空 model 即不启用兜底。
    fallback-model:
      model: deepseek-v4.1-flash
      # 兜底预算需覆盖原场景的输出形态，避免降级后可用预算反而不足。
      # 上限只是天花板，不改变实际输出量。
      max-tokens: 100000
      temperature: 0.3
      enable-thinking: false
      # base-url / api-key 留空 = 沿用主模型（同供应商时只需写模型名）；
      # 跨供应商时填这里，例如：
      # base-url: https://api.deepseek.com
      # api-key: ${FALLBACK_API_KEY:}

    embedding-api:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${LLM_API_KEY:}
      embeddings-path: /v1/embeddings
      model: qwen3.7-text-embedding
      dimensions: 1024                  # 显式钉死维度，不依赖供应商默认值漂移（Spring AI 的 dimensions 参数）
      # 换 embedding 模型**必须重嵌**：维度相同**不代表**向量空间兼容——旧模型
      batch-size: 10

  # 无人值守续写：一次提交按计划反复自续批，直到达标或触发停机条件。
  # **默认关闭**——开启后作业会自动连续花 token，请先确认 budget 熔断已配置。
  run-plan:
    enabled: false
    # 目标总章数；留空则用 story.constraints.max-chapter-count（再空则用请求里的 chapterCount 作为单批上限）
    target-chapters:
    # 单批章数（每个子作业生成的章数）；留空则用请求里的 chapterCount
    batch-size:
    # 最多自动续批多少轮；0 = 不限制（仍有预算熔断与总章数上限兜底）
    max-batches: 0
    # 体检分级达到该档即停止自动续批，交人工过问：WATCH / DEGRADED / CRITICAL
    stop-on-health-level: CRITICAL

  # 正文材料组装方式（正文模型实际看到什么）：
  #   LEGACY = 由 chapter-beats 场景的模型把完整背景压成分段任务摘要，写手只看压缩结果。
  #   DIRECT（默认）= 代码确定性组装 + 轻装写手模式：场景原文照录、只给在场人物状态与同情绪语感切片。
  writer-context-mode: DIRECT
  # DIRECT 暂固定整章直通；分段预算预留，知识时序和场内工作态完成前不启用。
  # 此路径是实验入口，不代表限知隔离已经实现；默认仍使用 LEGACY。
  writer-context-section-chars: 0

  # 观察式 Rebase：根据真实人物状态生成“候选计划 + 差异报告”，默认关闭。
  # PROPOSE_ONLY 只落候选，正文仍按原计划执行；不会自动采纳或重排整本书。
  rebase:
    mode: OFF
    max-proposals: 1

  # 场景因果与正文交付核验：两个阶段独立配置，不会互相开启。
  causality:
    # 计划前提核验：OFF 不调用；OBSERVE 只记录；ENFORCE 可驳回计划。
    plan-mode: OFF
    # 正文交付验收（不是计划审查）：检查正文是否兑现当前计划的场景/步骤/关键事件。
    # OFF = NOT_CHECKED，保持既有行为；OBSERVE = 记录报告与稿件/计划 hash，不因报告阻断提交；
    # ENFORCE = 仅同稿同计划 PASS 可提交，ISSUE/UNKNOWN/缺失或过期报告均不放行。
    # 严格模式要求 audit.enabled=true；不改变机械预检，也不自动开启任何候选等级开关。
    # 当前维持 OFF 兼容：本地 Mock 仅证明控制流，真实模型校准需授权，校准后显式改为 ENFORCE 才拦截。
    audit-mode: OFF

  # 全书总章数上限（完结保护）：enforce-chapter-limit=true 时强制 max-chapter-count，
  # 续写偏移达到上限即拒绝生成（故事已完结）；本批超出的章节数会被自动截断
  constraints:
    enforce-chapter-limit: true
    max-chapter-count: 188

  # 向量库连接（Qdrant gRPC 端口；6333 为 REST/dashboard，WSL2 localhost 自动转发）
  vector-store:
    host: localhost
    port: 6334

  # 章节审校开关
  audit:
    enabled: true
    enforce-minimum-chapter-length: true

  # 段落审校只保存逐处删改建议，默认关闭以减少对正文风格的过度削平与额外 LLM 消耗
  paragraph-audit:
    enabled: false
    max-patches: 3

  # 章节修订开关
  revise:
    enabled: true
    max-attempts: 2
    patch-enabled: true

  # 只删不扩·主编去解释刮油刀（在 DIRECT 初稿后剥除“不是A而是B”、事后复盘与静态简历）
  prose-scalpel:
    enabled: true
    max-patches: 8

  # 候选选优（六期）：审校低置信通过（MINOR 残留/修订过才闭环）时，重写候选，
  # 机械排序 + 盲评二选一；挑战者复审不过自动回退原稿与原报告，严格模式另须同稿同计划交付 PASS。
  # UNKNOWN/未验证/计划待调整不发候选调用；已确认 ISSUE 仅在显式开启 DEBT 通道时允许救场。
  # 重写与评审分别走 scene-models.chapter-rewrite / chapter-judge 两族配置：
  # 当前 rewrite=qwen3.8-flash（与原稿同族，零消耗），judge=deepseek-v4-flash（异族中立评审两份 qwen 稿）
  candidate:
    enabled: false          # 总开关（第二模型族 API 未配置时保持 false，避免每章空转失败）
    max-candidates: 1
    trigger-on-minor-residue: false
    minor-residue-threshold: 6
    # 默认关闭（原为 true）：整章重写+盲评单次 20 分钟量级、采纳率约 2/3——
    # 默认开着会让单章耗时翻十倍。要最高质量时在 05 项目模型设置里打开 candidate 开关
    trigger-on-revised-pass: false
    trigger-on-debt: false
    rewrite-max-tokens: 16384

  ledger-adjudicate:
    enabled: true
    max-items: 12

  budget:
    warn-total-tokens: 1200000
    hard-total-tokens: 2500000

  quality-review:
    enabled: true
    interval-chapters: 10
    sample-size: 3
    max-chapter-chars: 6000
    rubric-version: v1

  plan:
    branches: 2
    rolling-single-chapter: true

  # 动态参考资料选择器（skill 式按需注入）：索引交给 LLM 挑选，命中的资料全文注入
  prompt:
    reference-selector:
      enabled: true          # 总开关：关闭后不发起选择调用、不注入动态资料
      cache-enabled: true    # 按 场景+题材+章节类型 缓存选择结果；false 则每章实时选择
      max-selected: 3        # 单次最多注入的资料份数
      # 只配置聊天模型即可使用 LLM 索引选择。需要向量语义检索时，先配置 Embedding API Key，再切换到 vector。
      mode: llm
      top-k: 3               # 向量检索命中点数（聚合到文件级后受 max-selected 截断）
      min-score: 0.35        # 向量检索最低相似分（Cosine 越大越相近）；过滤无关命中
      max-recall-chars: 12000 # 动态资料全文注入字符预算，超出按段落截
      content-scene-recall-chars: 6000
      # 块级注入（默认关闭）：命中完整资料块而不是整份文件；依赖项随带，装不下的整块放弃。
      content-blocks:
        enabled: false
        candidate-top-k: 12
        max-blocks: 6
        max-chars: 2000
        per-doc-max-chars: 1500

    # 故事记忆层（二期跨章剧情记忆 + 三期人物/世界观记忆）：每章检查点把本章摘要/账本/设定
    story-memory:
      enabled: true          # 总开关：关闭后不索引、不检索，前缀不含唤醒节
      collection-prefix: novel-memory
      top-k: 10              # 检索候选池大小（章节/账本/设定混排，分数降序）。
      min-score: 0.35        # 最低相似分（Cosine）；低于则丢弃，防无关记忆注水
      max-recall-chars: 2000 # 唤醒节注入字符预算（按分数降序贪心累计，装不下的候选跳过）。
      retrieve-max-attempts: 3  # 检索瞬时失败的最大尝试次数（含首次，1=不重试）。
      world-collection-prefix: novel-world  # 世界集合名前缀（五期）：实际集合名 = 前缀 + "-" + worldId
      # world-min-score: 0.35               # 世界集合最低相似分；注释掉则回退 min-score

    # 正文前缀总预算：块级封顶之上的最后一道总额约束。
    # 前缀由末态红线/境界锁定/前情记忆(10 个子块)/风格门禁/一致性索引/禁泄清单等拼成，每块都有独立封顶，
    # 但"封顶之和"会随块数增长击穿模型输入窗口（每轮迭代都在加新块，没有任何一处在管总数）。
    # 超限时 PromptBudgetGuard 按优先级淘汰（刻度见其类注释）：先弃软提示（久远唤醒/文风指纹，5 档），
    # 再动第 4 档（三账本/伏笔账/一致性索引/风格警示/疲劳词红线/情节模式黑名单/审校反馈）。
    # 第 4 档内部按**入参顺序**贪心填满；截断按实际占用扣减余量、不清零（修正：原先
      # 截断即清零，档内第一个装不下的块会连带丢掉其后所有同档块）。
    # 正文前缀中三账本/伏笔账（档内最大两块）由 ChapterWorker 抽到档内末尾承担截断，保住
    # 情节模式黑名单/审校反馈两个小纠正通道。治理方向仍是让档内总量装得下，而不是调优先级：
    # 删掉黑名单的内容复述节即为此。
    # 核心块（末态红线、境界锁定、近章摘要、偏差警示、质量债）最后才动；可截断块按段落边界截断并标注，
    # 不可截断块（禁泄清单/境界锁定）放不下整块弃。
    # 每次装配一行 INFO（grep「前缀预算」得各块字数与占比），预算触及核心块或占比≥90% 时升 WARN。
    budget:
      total-prefix-chars: 18000  # 上限（字符）；<=0 关闭总额约束（退化为逐块直拼，便于对比排查）。
      plan-prefix-chars: 20000   # 章节计划**输入段**（故事设定 + 记忆前缀）上限（字符）；<=0 关闭。

