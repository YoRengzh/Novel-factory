<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>StartDrafts</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14161d;
        color: #d7dbe4;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        user-select: none;
        -webkit-app-region: no-drag;
    }
    .wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
    }
    .logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
    }
    .name {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #eef1f6;
    }
    .status {
        font-size: 12.5px;
        color: #8a92a6;
        letter-spacing: 1px;
    }
    .dots {
        display: inline-block;
        width: 34px;
        text-align: left;
    }
    .dots::after {
        content: "";
        animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
        0%  { content: ""; }
        25% { content: "·"; }
        50% { content: "··"; }
        75% { content: "···"; }
    }
    .bar {
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: #262b38;
        overflow: hidden;
        position: relative;
    }
    .bar::after {
        content: "";
        position: absolute;
        left: -40%;
        top: 0;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #5b8cff, transparent);
        animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide {
        to { left: 100%; }
    }
</style>
</head>
<body>
    <div class="wrap">
        <img class="logo" src="icon-256x256.png" alt="StartDrafts">
        <div class="name">StartDrafts</div>
        <div class="status">正在启动本地服务<span class="dots"></span></div>
        <div class="bar"></div>
    </div>
</body>
</html>
